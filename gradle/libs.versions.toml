# Author: JunyoungJung
# Date: 2026-09-15
#
# 버전 근거는 DEVELOPMENT.md §의존성 표. 전부 2026-09-15 Maven Central·Google Maven 실측값이다.

[versions]
agp = "9.4.0"
kotlin = "2.4.20"
compileSdk = "37"
minSdk = "30"

composeBom = "2026.09.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
webkit = "1.17.0"

coroutines = "1.11.0"
commonmark = "0.30.0"
ratex = "0.1.14"
quickjs = "1.0.15"

junitJupiter = "6.1.3"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestCore = "1.7.0"

# 데모 앱 전용 (2026-09-15 Google Maven·Maven Central maven-metadata 실측, 각 최신 stable)
desugarJdkLibs = "2.1.5"
lifecycleRuntimeKtx = "2.11.0"
recyclerview = "1.4.0"
appcompat = "1.8.0"
okhttp = "5.5.0"

[libraries]
# 파서 (D3). 코어는 이 셋만 의존한다.
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# 수식 엔진 (D4, provisional)
ratex-android = { module = "io.github.erweixin:ratex-android", version.ref = "ratex" }

# 하이라이트 엔진 (D6)
quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs" }

# Mermaid (D7)
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-text = { module = "androidx.compose.ui:ui-text" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# 데모 앱 전용. D3a: commonmark `List.of`(API 30)를 API 24에서 쓰기 위한 core library desugaring.
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# instrumented spike/테스트 (에뮬레이터)
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Maven Central 발행 (Central Portal). 2026-09-15 plugins.gradle.org 최신 stable 0.37.0.
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
