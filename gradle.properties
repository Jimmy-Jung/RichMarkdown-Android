# Author: JunyoungJung
# Date: 2026-09-15

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# configuration cache는 --project-cache-dir를 무시하고 저장소 루트 .gradle/에 기록한다(Gradle 9.6 실측) → 외장 SSD 규칙 위반으로 비활성화
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 라이브러리 좌표 (DEVELOPMENT.md D8). 버전은 iOS와 독립된 semver다.
GROUP=io.github.jimmy-jung
VERSION_NAME=0.1.0-SNAPSHOT

# Maven Central POM 공통값 (com.vanniktech.maven.publish가 읽는다). 모듈별 POM_ARTIFACT_ID·POM_NAME·POM_DESCRIPTION은 각 모듈 gradle.properties.
POM_URL=https://github.com/Jimmy-Jung/RichMarkdown-Android
POM_SCM_URL=https://github.com/Jimmy-Jung/RichMarkdown-Android
POM_SCM_CONNECTION=scm:git:git://github.com/Jimmy-Jung/RichMarkdown-Android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/Jimmy-Jung/RichMarkdown-Android.git
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_DEVELOPER_ID=jimmy-jung
POM_DEVELOPER_NAME=JunyoungJung
POM_DEVELOPER_URL=https://github.com/Jimmy-Jung
POM_INCEPTION_YEAR=2026
# 서명은 발행 시에만 켠다 (자격 증명·키는 ~/.gradle/gradle.properties: mavenCentralUsername/Password, signingInMemoryKey/Password).
RELEASE_SIGNING_ENABLED=false
